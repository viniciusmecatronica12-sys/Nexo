<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F3">
<title>Nexo — diário temporal de cuidado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F3F6F3;--surface:#FFF;--surface2:#F7FAF7;--surface3:#EDF4EF;
  --text:#142018;--text2:#5E6B63;--text3:#8C9990;--line:#DCE6DE;--line2:#EAF0EB;
  --brand:#2F7D4A;--brand2:#4C9C67;--brandSoft:#E1F2E6;
  --warning:#B57921;--warningSoft:#FFF2D8;--danger:#B84C42;--dangerSoft:#FDE8E5;
  --info:#4B6F8E;--infoSoft:#E9F1F8;
  --r-xl:28px;--r-lg:20px;--r-md:14px;--shadow:0 1px 2px rgba(20,31,24,.05),0 15px 35px -26px rgba(20,50,31,.35);
  --serif:"Newsreader",Georgia,serif;--sans:"Urbanist",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0D1210;--surface:#141B17;--surface2:#18211C;--surface3:#1D2A22;
  --text:#EFF4F0;--text2:#A9B5AD;--text3:#728178;--line:#28332C;--line2:#202923;
  --brand:#79C493;--brand2:#97D1AA;--brandSoft:#1D3325;
  --warning:#E2B361;--warningSoft:#322719;--danger:#EF9388;--dangerSoft:#35201D;
  --info:#91B7D4;--infoSoft:#1D2A35;--shadow:0 12px 30px -24px rgba(0,0,0,.9)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:
 radial-gradient(circle at 0 -10%,rgba(80,150,100,.10),transparent 28%),
 var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 28%,transparent);outline-offset:2px}
svg{display:block}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{min-height:100vh}.sidebar{display:none}.shell{min-width:0}
.header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
.header-inner{max-width:780px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 11px;display:flex;align-items:center;gap:10px}
.head-copy{flex:1;min-width:0}.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--text3)}
.head-title{font-size:17px;font-weight:700;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-sub{font-size:11.5px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-action{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.top-action svg,.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;box-shadow:var(--shadow)}
main{max-width:780px;margin:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.page{display:none}.page.active{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 2px 10px}.section-head:first-child{margin-top:0}
.section-title{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;letter-spacing:-.02em}.section-sub{font-size:11.5px;color:var(--text3);margin-top:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}.card+.card{margin-top:12px}
.card-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.card-label .quiet{text-transform:none;letter-spacing:0;font-weight:500;font-size:11px}.muted{color:var(--text2)}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#DDF1E4,#CBE9D6);color:#15331F;border-radius:var(--r-xl);padding:22px;box-shadow:0 20px 50px -32px rgba(20,70,40,.5)}
:root[data-theme="dark"] .hero{background:linear-gradient(145deg,#193120,#22402B);color:#EEF7F0}
.hero::after{content:"";position:absolute;width:180px;height:180px;right:-75px;top:-85px;border:34px solid rgba(255,255,255,.18);border-radius:50%}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.52);padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}
:root[data-theme="dark"] .pill{background:rgba(255,255,255,.07)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.hero-title{font-family:var(--serif);font-size:31px;font-weight:700;line-height:1.02;margin-top:20px;max-width:90%;position:relative;z-index:1}.hero-meta{font-size:12.5px;opacity:.75;margin-top:7px;position:relative;z-index:1}
.hero-actions{display:flex;gap:8px;margin-top:18px;position:relative;z-index:1}
.primary,.secondary,.danger{min-height:44px;border-radius:13px;padding:0 14px;font-size:12.5px;font-weight:800}
.primary{background:var(--text);color:var(--bg);border:1px solid var(--text)}.hero .primary{background:#fff;color:#173220;border-color:#fff}:root[data-theme="dark"] .hero .primary{background:var(--brand);color:#0D1710;border-color:var(--brand)}
.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--text2)}.danger{background:var(--dangerSoft);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
.quick-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(105px,1fr);gap:9px;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:3px}.quick-strip::-webkit-scrollbar{display:none}
.quick{min-height:78px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.quick i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface3);color:var(--brand);font-style:normal}.quick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.quick span{font-size:11.5px;font-weight:800}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.summary{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;min-height:110px;text-align:left;box-shadow:var(--shadow)}
.summary .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--text3)}.summary .v{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:8px;line-height:1.05}.summary .s{font-size:10.5px;color:var(--text3);margin-top:6px;line-height:1.35}
.timeline{position:relative;padding-left:64px}.timeline::before{content:"";position:absolute;left:49px;top:6px;bottom:6px;width:1px;background:var(--line)}
.event{position:relative;padding:0 0 17px}.event:last-child{padding-bottom:0}.event .time{position:absolute;left:-64px;width:38px;text-align:right;font:700 10.5px var(--mono);color:var(--text3);top:1px}
.event::before{content:"";position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--surface)}
.event.future{opacity:.55}.event.future::before{background:var(--surface);border:2px solid var(--text3)}.event.alert::before{background:var(--warning)}.event.note::before{background:var(--info)}
.event .t{font-size:13px;font-weight:700;line-height:1.35}.event .s{font-size:10.5px;color:var(--text3);margin-top:2px}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line2)}.row:first-child{border-top:0;padding-top:0}.row:last-child{padding-bottom:0}.row-time{width:44px;flex:none;font:700 11px var(--mono);color:var(--text2)}.row-main{flex:1;min-width:0}.row-title{font-size:13.5px;font-weight:700}.row-sub{font-size:10.5px;color:var(--text3);margin-top:2px}
.status{height:35px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);padding:0 12px;font-size:10.5px;font-weight:800;color:var(--text2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:800;color:var(--text3)}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:13px;background:var(--surface2);color:var(--text);padding:10px 11px;font-size:12.5px}input[type=time],input[type=date],input[type=number]{font-family:var(--mono)}textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-height:37px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:0 11px;font-size:11.5px;font-weight:700;color:var(--text2)}.chip.on{background:var(--brandSoft);border-color:color-mix(in srgb,var(--brand) 50%,var(--line));color:var(--brand)}.chip.warn.on{background:var(--warningSoft);border-color:color-mix(in srgb,var(--warning) 50%,var(--line));color:var(--warning)}
.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{border:1px dashed var(--line);background:var(--surface2);border-radius:14px;padding:17px;text-align:center;color:var(--text3);font-size:12px}
.date-nav{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center}.date-center{text-align:center}.date-center strong{display:block;font-size:13.5px}.date-center span{font-size:10.5px;color:var(--text3)}.square{width:42px;height:42px;border:1px solid var(--line);background:var(--surface2);border-radius:13px;font-size:18px}
.alertbox{padding:12px 13px;border-radius:14px;background:var(--warningSoft);border:1px solid color-mix(in srgb,var(--warning) 45%,var(--line));color:var(--warning);font-size:11.5px;line-height:1.5}
.report{min-height:320px;font:11px/1.5 var(--mono);white-space:pre-wrap}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav-btn{min-height:52px;border:0;background:none;border-radius:12px;color:var(--text3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9.5px;font-weight:800}.nav-btn.active{color:var(--brand)}.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:55;width:58px;height:58px;border-radius:20px;border:4px solid var(--bg);background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 16px 28px -14px rgba(32,88,53,.65)}.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(8,13,10,.5);display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:660px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -24px 80px -40px rgba(0,0,0,.6)}.handle{width:42px;height:4px;border-radius:999px;background:var(--line);margin:2px auto 14px}.sheet-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}.sheet-title{font-family:var(--serif);font-size:24px;font-weight:700;flex:1}.close{width:38px;height:38px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;font-size:20px}.back{border:0;background:none;color:var(--brand);font-size:11.5px;font-weight:800;padding:0}
.sheet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sheet-action{min-height:92px;border:1px solid var(--line);background:var(--surface2);border-radius:18px;padding:14px;text-align:left}.sheet-action svg{width:20px;height:20px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round}.sheet-action strong{display:block;font-size:12.5px;margin-top:11px}.sheet-action small{display:block;color:var(--text3);font-size:10px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));z-index:100;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:999px;font-size:11.5px;font-weight:800;box-shadow:0 12px 30px -18px rgba(0,0,0,.7);max-width:88vw;text-align:center}
@media(min-width:900px){
 .app{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1240px;margin:auto}.sidebar{display:flex;position:sticky;top:0;height:100vh;flex-direction:column;padding:18px 14px;border-right:1px solid var(--line)}.brand{font-family:var(--serif);font-size:27px;font-weight:700;padding:6px 10px 22px}.brand small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
 .side-nav{display:flex;flex-direction:column;gap:4px}.side-btn{min-height:46px;border:0;background:none;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:11px;color:var(--text3);font-size:12.5px;font-weight:800}.side-btn.active{background:var(--brandSoft);color:var(--brand)}.side-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
 .side-register{margin-top:auto;width:100%;min-height:47px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:800}.bottom-nav,.fab{display:none}.header-inner,main{max-width:820px}main{padding-bottom:60px}
}
@media print{.sidebar,.bottom-nav,.fab,.header,.inline,.quick-strip{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}main{max-width:none;padding:0}}
.auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 0 -10%,rgba(80,150,100,.10),transparent 28%),var(--bg)}
.auth-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:28px 24px;box-shadow:var(--shadow)}
.auth-box h1{font-family:var(--serif);font-size:27px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.auth-box .sub{font-size:12.5px;color:var(--text2);margin:0 0 22px}
.auth-tabs{display:flex;gap:6px;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:18px}
.auth-tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--text2)}
.auth-tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-box .field{margin-bottom:12px}
.auth-box .field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px}
.auth-box input{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:0 13px;font-size:15px;color:var(--text)}
.auth-box .primary{width:100%;margin-top:6px}
.auth-err{background:var(--dangerSoft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:14px}
.auth-forgot{display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--text2);background:none;border:0}
.auth-loading{font-size:13px;color:var(--text2);text-align:center}
.auth-setup{font-size:12.5px;color:var(--text2);line-height:1.6}
.auth-setup pre{background:var(--text);color:var(--bg);padding:12px;border-radius:10px;font-family:var(--mono);font-size:11px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div id="authGate"></div>
<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">Nexo<small>diário de cuidado</small></div>
    <nav class="side-nav" id="sideNav"></nav>
    <button class="side-register" data-a="open-register">＋ Registrar</button>
  </aside>
  <div class="shell">
    <header class="header">
      <div class="header-inner">
        <div class="head-copy" id="headCopy"></div>
        <button class="icon-btn" data-a="theme" aria-label="Alternar tema" id="themeBtn"></button>
        <button class="top-action" data-a="family">${''}<span>Família</span></button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav" style="display:none"></nav>
<button class="fab" data-a="open-register" aria-label="Registrar algo" id="fabBtn" style="display:none"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="modal"></div><div id="toast"></div>

<script>

"use strict";
const $=(q,r=document)=>r.querySelector(q);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const now=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const addDay=(s,n)=>{const [y,m,d]=s.split("-").map(Number),x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return iso(x)};
const fmt=(s,full=false)=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("pt-BR",full?{weekday:"long",day:"numeric",month:"long"}:{day:"2-digit",month:"short"})};
const min2=s=>{const [h,m]=String(s||"00:00").split(":").map(Number);return (h||0)*60+(m||0)};
function toast(msg){$("#toast").innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toast").innerHTML="",2100)}
function icon(n){
 const x={
  home:'<path d="M4 10.5 12 4l8 6.5V20h-5v-5H9v5H4z"/>',
  routine:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h5M8 17h7"/>',
  state:'<circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01M8.5 15c1.8 1.5 5.2 1.5 7 0"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4M12 8v5l3 2"/>',
  family:'<circle cx="8.5" cy="8" r="2.5"/><circle cx="16" cy="9" r="2"/><path d="M3.5 19c0-3 2.3-5 5-5s5 2 5 5M13 14.5c2.2.3 4 2 4 4.5"/>',
  med:'<path d="M5.5 18.5a4 4 0 0 1 0-5.7l7.3-7.3a4 4 0 0 1 5.7 5.7l-7.3 7.3a4 4 0 0 1-5.7 0Z"/><path d="m9 9 6 6"/>',
  water:'<path d="M12 3.7c3.4 3.8 5.2 6.3 5.2 8.8a5.2 5.2 0 1 1-10.4 0c0-2.5 1.8-5 5.2-8.8Z"/>',
  food:'<path d="M6 3v7a2 2 0 0 0 4 0V3M8 10v11M17 3c-1.5 1.4-2.3 3.2-2.3 5.3 0 2.3 1 4.1 2.3 4.7v8"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5Z"/>',
  note:'<path d="M5 4h11l3 3v13H5z"/><path d="M15 4v4h4M8 12h8M8 15h5"/>',
  activity:'<path d="M4 13h3l2-6 4 12 2-6h5"/>',
  alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v6M12 17h.01"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/>',
  moon2:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5Z"/>'
 };return `<svg viewBox="0 0 24 24">${x[n]||x.home}</svg>`
}

const KEY="nexo.temporal.v1";
const MOODS=["Estável","Triste","Apático","Ansioso","Irritado","Acelerado","Desconfiado","Chorou"];
const SIGNS=["Muito sonolento","Tremor","Rigidez muscular","Não para as pernas","Movimentos da boca/língua","Boca muito seca","Tonto ao levantar","Caiu","Enjoo ou vômito","Febre","Recusou o remédio","Recusou comida","Bebeu pouca água","Mais confuso que antes","Agressivo"];
const SCALE={
 fala:["Clara e organizada","Um pouco confusa","Bem desorganizada","Difícil acompanhar"],
 agitacao:["Calmo","Inquieto","Muito agitado","Sem controle"],
 orientacao:["Sabe onde está e que dia é","Confunde às vezes","Confunde bastante","Não reconhece as pessoas"]
};
const MEALS=["Café da manhã","Almoço","Jantar","Lanche"];
const FEZES=["Normal","Ressecada","Mole","Diarreia"];
const URINA=["Clara","Amarela","Escura"];

function base(){
 return{
  patient:"",activeCaregiver:"",caregivers:["Vinicius","Luis","Nuri"],
  contacts:{psiquiatra:"",clinico:"",caps:"",farmacia:""},
  medications:[],
  plan:{waterTargetMl:0,sleepTargetHours:0,activityTargetMinutes:0},
  records:[],
  createdAt:Date.now()
 }
}
function load(){
 try{
  const t=localStorage.getItem(KEY);
  if(t)return {...base(),...JSON.parse(t)};
 }catch(e){}
 return base()
}
let S=load(),TAB="home",DATE=today(),SHEET=null,THEME=localStorage.getItem("nexo.theme")||"auto";
function save(){localStorage.setItem(KEY,JSON.stringify(S));scheduleSync()}
function recs(dt=DATE,type=null){
 return S.records.filter(r=>(!dt||r.date===dt)&&(!type||r.type===type)).sort((a,b)=>(a.time||"").localeCompare(b.time||""))
}
function addRecord(type,data,date=today(),time=now()){
 S.records.push({id:uid(),type,date,time,caregiver:S.activeCaregiver||"",createdAt:Date.now(),...data});save()
}
function removeRecord(id){S.records=S.records.filter(r=>r.id!==id);save()}
function medById(id){return S.medications.find(m=>m.id===id)}
function medSchedulesFor(dt=DATE){
 const out=[];
 S.medications.forEach(m=>(m.times||[]).forEach(t=>out.push({med:m,time:t,date:dt})));
 return out.sort((a,b)=>a.time.localeCompare(b.time))
}
function medTaken(medId,date,time){
 return S.records.find(r=>r.type==="medication"&&r.medicationId===medId&&r.date===date&&r.scheduledTime===time)
}
function nextMedication(){
 if(DATE!==today())return null;
 const all=medSchedulesFor(today()).filter(x=>!medTaken(x.med.id,today(),x.time));
 if(!all.length)return null;
 const m=min2(now()),due=all.filter(x=>min2(x.time)<=m).sort((a,b)=>b.time.localeCompare(a.time))[0];
 return due?{...due,due:true}:all[0]
}
function latest(type,dt=today()){const a=recs(dt,type);return a[a.length-1]||null}
function countType(type,dt=today()){return recs(dt,type).length}
function fmtRec(r){
 const d=r.data||r;
 switch(r.type){
  case"medication":return{title:`${r.name||medById(r.medicationId)?.name||"Medicação"} · ${r.dose||""}`,sub:`administrado${r.scheduledTime?` · previsto ${r.scheduledTime}`:""}${r.caregiver?` · ${r.caregiver}`:""}`};
  case"water":return{title:`Água · ${r.amountMl||0} ml`,sub:r.caregiver||""};
  case"meal":return{title:`${r.meal||"Refeição"} · ${r.amount||""}`,sub:r.note||""};
  case"sleep":return{title:`Sono · ${r.startTime||"?"}–${r.endTime||"?"}`,sub:r.quality||""};
  case"state":return{title:`Estado · ${r.summary||"registro"}`,sub:[r.mood?.join(", "),r.note].filter(Boolean).join(" · ")};
  case"symptom":return{title:`Sintoma · ${r.symptom||""}`,sub:r.note||""};
  case"activity":return{title:`Atividade · ${r.activity||""}`,sub:r.duration?`${r.duration} min`:""};
  case"evacuation":return{title:`Evacuação · ${r.kind||""}`,sub:r.note||""};
  case"urine":return{title:`Urina · ${r.color||""}`,sub:r.note||""};
  case"note":return{title:r.text||"Observação",sub:r.caregiver||""};
  case"caregiver_shift":return{title:`Jornada do cuidador · ${r.caregiverName||r.caregiver||"Cuidador"}`,sub:`${r.startTime||"?"}–${r.endTime||"?"}${r.note?` · ${r.note}`:""}`};
  default:return{title:r.type,sub:""}
 }
}
function allDayEvents(dt=DATE){
 const list=[...recs(dt)];
 if(dt===today()){
  const n=nextMedication();
  if(n)list.push({id:"future",type:"future",date:dt,time:n.time,name:n.med.name,dose:n.med.dose,scheduled:true})
 }
 return list.sort((a,b)=>(a.time||"").localeCompare(b.time||""))
}
function sleepDuration(r){
 if(!r?.startTime||!r?.endTime)return null;
 let d=min2(r.endTime)-min2(r.startTime);if(d<=0)d+=1440;return d/60
}
function report(days){
 const L=[`NEXO — RESUMO HISTÓRICO DE CUIDADO`,`Período: ${addDay(DATE,-days+1)} a ${DATE}`,""];
 if(S.patient)L.push(`Paciente: ${S.patient}`,"");
 if(S.medications.length){
  L.push("MEDICAÇÕES CADASTRADAS");
  S.medications.forEach(m=>L.push(`• ${m.name} ${m.dose||""} — ${(m.times||[]).join(", ")}`));L.push("")
 }
 for(let i=days-1;i>=0;i--){
  const dt=addDay(DATE,-i),rs=recs(dt);
  if(!rs.length)continue;
  L.push(`=== ${dt} ===`);
  rs.forEach(r=>{const f=fmtRec(r);L.push(`${r.time} | ${f.title}${f.sub?` | ${f.sub}`:""}`)});
  L.push("")
 }
 return L.join("\n")
}

 ${dateSelector()}${timeline(DATE)}

/* FAMILY MODAL */

 <div class="card" style="box-shadow:none"><div class="card-label">Quem está sendo cuidado</div><div class="field"><label>Nome</label><input data-root="patient" value="${esc(S.patient)}"></div></div>

 <div class="card" style="box-shadow:none"><div class="card-label">Outras pessoas da família</div>
  <p class="muted" style="font-size:12px;margin:0 0 12px">Usado para registrar a jornada de alguém que não está logado neste aparelho.</p>

     <div class="field full"><label>Data</label><input type="date" id="shiftDate" value="${today()}"></div>
     <div class="field"><label>Início</label><input type="time" id="shiftStart" value="${now()}"></div>
     <div class="field"><label>Fim</label><input type="time" id="shiftEnd"></div>

 </div>
 <div class="card" style="box-shadow:none"><div class="card-label">Contatos profissionais</div><div class="form-grid">
 <div class="field"><label>Psiquiatra</label><input data-root="contacts.psiquiatra" value="${esc(S.contacts.psiquiatra||"")}"></div><div class="field"><label>CAPS / serviço</label><input data-root="contacts.caps" value="${esc(S.contacts.caps||"")}"></div>
 <div class="field"><label>Clínico</label><input data-root="contacts.clinico" value="${esc(S.contacts.clinico||"")}"></div><div class="field"><label>Farmácia</label><input data-root="contacts.farmacia" value="${esc(S.contacts.farmacia||"")}"></div></div></div>
 <div class="card" style="box-shadow:none"><div class="card-label">Notificações</div>
  <p class="muted" style="font-size:12px;margin:0 0 12px">Avisa neste aparelho quando outra pessoa da família registrar algo — funciona com o app aberto ou recém em segundo plano. Com o app totalmente fechado, o aviso pode não chegar; isso depende do celular.</p>

/* SHEETS */
function temporalFields(prefix="",date=DATE,time=now()){
 return `<div class="form-grid"><div class="field"><label>Data</label><input type="date" id="${prefix}Date" value="${esc(date)}"></div><div class="field"><label>Horário</label><input type="time" id="${prefix}Time" value="${esc(time)}"></div></div>`
}
function renderSheet(){
 if(!SHEET)return;
 let title="",body="";
 if(SHEET==="menu"){
  title="Registrar";
  body=`<div class="sheet-grid">${[["med","Medicação","Horário e dosagem","med"],["water","Água","Horário e quantidade","water"],["food","Alimentação","Refeição e quantidade","food"],["sleep","Sono","Dia, início e fim","moon"],["state","Estado","Dia, hora e observação","state"],["symptom","Sintoma","Dia, hora e sinal","alert"],["activity","Atividade","Dia, hora e duração","activity"],["evac","Evacuação","Dia, hora e aspecto","note"],["urine","Urina","Dia, hora e aspecto","water"],["note","Observação","Dia, hora e texto","note"]].map(x=>`<button class="sheet-action" data-a="sheet" data-sheet="${x[0]}">${icon(x[3])}<strong>${x[1]}</strong><small>${x[2]}</small></button>`).join("")}</div>`
 }else if(SHEET==="med"){
  title="Registrar medicação";
  body=`${temporalFields("med")}
  <div class="card-label" style="margin-top:14px">Medicações administradas agora<span class="quiet">toque em quantas precisar</span></div>
  ${S.medications.length?`<div class="chips">${S.medications.map(m=>`<button class="chip" data-medtoggle="${m.id}">${esc(m.name)} ${esc(m.dose||"")}</button>`).join("")}</div>`:`<div class="empty">Nenhum medicamento cadastrado ainda — use "Gerenciar prescrições" para adicionar.</div>`}
  <div class="form-grid" style="margin-top:14px"><div class="field"><label>Outro medicamento (opcional)</label><input id="medOutroNome" placeholder="Nome"></div><div class="field"><label>Dose do outro</label><input id="medOutroDose" placeholder="Ex.: 2 mg"></div>
  <div class="field full"><label>Observação (vale para todos selecionados)</label><input id="medNote" placeholder="Ex.: após alimentação"></div></div>
  <div class="inline"><button class="primary" data-a="save-med-record">Registrar</button></div>`
 }else if(SHEET==="water"){
  title="Registrar água";
  body=`${temporalFields("water")}<div class="form-grid" style="margin-top:10px"><div class="field full"><label>Quantidade em ml</label><input type="number" min="1" id="waterAmount" value="200"></div></div><div class="inline"><button class="primary" data-a="save-water">Registrar água</button></div>`
 }else if(SHEET==="food"){
  title="Registrar alimentação";
  body=`${temporalFields("food")}<div class="form-grid" style="margin-top:10px"><div class="field"><label>Refeição</label><select id="foodMeal">${MEALS.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Quantidade</label><select id="foodAmount">${["Tudo","Metade","Pouco","Nada"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field full"><label>Observação</label><input id="foodNote"></div></div><div class="inline"><button class="primary" data-a="save-food">Registrar</button></div>`
 }else if(SHEET==="sleep"){
  title="Registrar sono";
  body=`<div class="form-grid"><div class="field full"><label>Dia de referência</label><input type="date" id="sleepDate" value="${DATE}"></div><div class="field"><label>Início do sono</label><input type="time" id="sleepStart" value="22:00"></div><div class="field"><label>Fim do sono</label><input type="time" id="sleepEnd" value="07:00"></div><div class="field full"><label>Qualidade / observação</label><input id="sleepQuality" placeholder="Dormiu bem, despertou 2 vezes..."></div></div><div class="inline"><button class="primary" data-a="save-sleep">Registrar sono</button></div>`
 }else if(SHEET==="state"){
  title="Registrar estado";
  body=`${temporalFields("state")}<div style="margin-top:12px"><div class="card-label">Fala</div><div class="chips">${SCALE.fala.map((x,i)=>`<button class="chip" data-pick="fala" data-value="${i}">${x}</button>`).join("")}</div></div>
 <div style="margin-top:14px"><div class="card-label">Agitação</div><div class="chips">${SCALE.agitacao.map((x,i)=>`<button class="chip" data-pick="agitacao" data-value="${i}">${x}</button>`).join("")}</div></div>
 <div style="margin-top:14px"><div class="card-label">Orientação</div><div class="chips">${SCALE.orientacao.map((x,i)=>`<button class="chip" data-pick="orientacao" data-value="${i}">${x}</button>`).join("")}</div></div>
 <div style="margin-top:14px"><div class="card-label">Humor</div><div class="chips">${MOODS.map(x=>`<button class="chip" data-mood="${x}">${x}</button>`).join("")}</div></div>
 <div class="field" style="margin-top:12px"><label>Observação</label><textarea id="stateNote" placeholder="O que mudou ou chamou atenção?"></textarea></div><div class="inline"><button class="primary" data-a="save-state">Registrar estado</button></div>`
 }else if(SHEET==="symptom"){
  title="Registrar sintoma";
  body=`${temporalFields("sym")}<div style="margin-top:12px"><div class="chips">${SIGNS.map(x=>`<button class="chip warn" data-symptom="${x}">${x}</button>`).join("")}</div></div><div class="field" style="margin-top:12px"><label>Observação</label><textarea id="symNote"></textarea></div><div class="inline"><button class="primary" data-a="save-symptom">Registrar sintoma</button></div>`
 }else if(SHEET==="activity"){
  title="Registrar atividade";
  body=`${temporalFields("act")}<div class="form-grid" style="margin-top:10px"><div class="field full"><label>Atividade</label><input id="actName" placeholder="Caminhada, banho de sol..."></div><div class="field"><label>Duração (min)</label><input type="number" id="actDuration"></div></div><div class="inline"><button class="primary" data-a="save-activity">Registrar</button></div>`
 }else if(SHEET==="evac"){
  title="Registrar evacuação";
  body=`${temporalFields("ev")}<div class="field" style="margin-top:10px"><label>Aspecto</label><select id="evKind">${FEZES.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field" style="margin-top:10px"><label>Observação</label><input id="evNote"></div><div class="inline"><button class="primary" data-a="save-evac">Registrar</button></div>`
 }else if(SHEET==="urine"){
  title="Registrar urina";
  body=`${temporalFields("ur")}<div class="field" style="margin-top:10px"><label>Cor</label><select id="urColor">${URINA.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field" style="margin-top:10px"><label>Observação</label><input id="urNote"></div><div class="inline"><button class="primary" data-a="save-urine">Registrar</button></div>`
 }else if(SHEET==="note"){
  title="Registrar observação";
  body=`${temporalFields("note")}<div class="field" style="margin-top:10px"><label>Observação</label><textarea id="noteText" placeholder="Registre o que aconteceu sem precisar interpretar clinicamente."></textarea></div><div class="inline"><button class="primary" data-a="save-note">Registrar</button></div>`
 }else if(SHEET==="manage-meds"){
  title="Gerenciar medicações";
  body=`${S.medications.length?S.medications.map(m=>`<div class="row"><div class="row-main"><div class="row-title">${esc(m.name)}</div><div class="row-sub">${esc(m.dose||"")} · ${(m.times||[]).join(", ")}</div></div><button class="status" data-a="delete-med" data-id="${m.id}">Excluir</button></div>`).join(""):`<div class="empty">Nenhuma medicação cadastrada.</div>`}
  <div class="card" style="box-shadow:none;margin-top:12px;background:var(--surface2)"><div class="card-label">Adicionar à rotina</div><div class="form-grid"><div class="field"><label>Nome</label><input id="newMedName"></div><div class="field"><label>Dosagem padrão</label><input id="newMedDose"></div><div class="field full"><label>Horários separados por vírgula</label><input id="newMedTimes" placeholder="08:00, 20:00"></div></div><div class="inline"><button class="primary" data-a="save-med-config">Adicionar</button></div></div>`
 }
 $("#modal").innerHTML=`<div class="overlay" data-a="overlay"><div class="sheet"><div class="handle"></div><div class="sheet-head">${SHEET!=="menu"?`<button class="back" data-a="sheet" data-sheet="menu">‹ voltar</button>`:""}<div class="sheet-title">${title}</div><button class="close" data-a="close">×</button></div>${body}</div></div>`;
 initPicks()
}
let PICKS={fala:null,agitacao:null,orientacao:null,moods:[],symptom:null,meds:[]};
function initPicks(){PICKS={fala:null,agitacao:null,orientacao:null,moods:[],symptom:null,meds:[]}}
function closeModal(){SHEET=null;$("#modal").innerHTML=""}
function registerScheduledMed(medId,scheduledTime){
 const m=medById(medId);if(!m)return;
 const old=medTaken(medId,today(),scheduledTime);
 if(old){removeRecord(old.id);toast("Registro de administração removido");render();return}
 addRecord("medication",{medicationId:m.id,name:m.name,dose:m.dose,scheduledTime},today(),now());toast("Administração registrada");render()
}

/* EVENTS */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a], [data-pick], [data-mood], [data-symptom], [data-medtoggle]");if(!el)return;
 if(el.dataset.pick){PICKS[el.dataset.pick]=+el.dataset.value;document.querySelectorAll(`[data-pick="${el.dataset.pick}"]`).forEach(x=>x.classList.toggle("on",x===el));return}
 if(el.dataset.mood){const v=el.dataset.mood,i=PICKS.moods.indexOf(v);i>=0?PICKS.moods.splice(i,1):PICKS.moods.push(v);el.classList.toggle("on");return}
 if(el.dataset.medtoggle){const v=el.dataset.medtoggle,i=PICKS.meds.indexOf(v);i>=0?PICKS.meds.splice(i,1):PICKS.meds.push(v);el.classList.toggle("on");return}
 if(el.dataset.symptom){PICKS.symptom=el.dataset.symptom;document.querySelectorAll("[data-symptom]").forEach(x=>x.classList.toggle("on",x===el));return}
 const a=el.dataset.a;
 if(a==="overlay"&&e.target!==el)return;
 if(a==="tab"){TAB=el.dataset.tab;DATE=today();render();scrollTo({top:0,behavior:"smooth"});return}
 if(a==="family"){familyModal();return}
 if(a==="logout"){sair();return}
 if(a==="save-name"){
  const nome=$("#meuNome")?.value.trim();
  if(!nome){toast("Digite um nome");return}
  S.activeCaregiver=nome;
  if(!S.caregivers.includes(nome))S.caregivers.push(nome);
  save();renderHeader();familyModal();
  if(authUser&&authUser.updateProfile)authUser.updateProfile({displayName:nome}).catch(()=>{});
  toast("Nome salvo");
  return
 }
 if(a==="sync-now"){
  if(!fbDb){toast("Sem conexão configurada");return}
  fbDb.ref(FAMILY_PATH).once("value").then(snap=>{
   const novos=mergeIncoming(snap.val());
   if(novos.length){save();render();familyModal()}else{toast("Já está tudo sincronizado")}
  }).catch(()=>toast("Sem conexão com o servidor agora"));
  return
 }
 if(a==="auth-mode"){authMode=el.dataset.mode;authBusy=false;renderAuthBox();return}
 if(a==="auth-submit"){submeterAuth();return}
 if(a==="auth-forgot"){esqueciSenha();return}
 if(a==="notify-on"){requestNotify();return}
 if(a==="notify-off"){setNotifyEnabled(false);toast("Avisos desativados");familyModal();return}
 if(a==="theme"){THEME=document.documentElement.dataset.theme==="dark"?"light":"dark";localStorage.setItem("nexo.theme",THEME);applyTheme();render();return}
 if(a==="open-register"){SHEET="menu";renderSheet();return}
 if(a==="sheet"){SHEET=el.dataset.sheet;renderSheet();return}
 if(a==="close"||a==="overlay"){closeModal();return}
 if(a==="toggle-config"){configExpandida=!configExpandida;render();return}
 if(a==="save-patient"){const v=$("#patientInline")?.value.trim();if(v){S.patient=v;save();toast("Paciente salvo");configExpandida=false;render()}return}
 if(a==="register-scheduled-med"){registerScheduledMed(el.dataset.med,el.dataset.time);return}
 if(a==="save-med-record"){
   const date=$("#medDate").value,time=$("#medTime").value,note=$("#medNote")?.value.trim()||"";
   const outroNome=$("#medOutroNome")?.value.trim(),outroDose=$("#medOutroDose")?.value.trim();
   const selecionadas=PICKS.meds.map(id=>medById(id)).filter(Boolean);
   if(!selecionadas.length&&!outroNome){toast("Selecione ao menos um medicamento");return}
   selecionadas.forEach(m=>addRecord("medication",{medicationId:m.id,name:m.name,dose:m.dose,note},date,time));
   if(outroNome)addRecord("medication",{medicationId:null,name:outroNome,dose:outroDose,note},date,time);
   const total=selecionadas.length+(outroNome?1:0);
   toast(total>1?total+" medicações registradas":"Medicação registrada");
   closeModal();render();return
 }
 if(a==="save-water"){const amount=+$("#waterAmount").value;if(amount<=0){toast("Informe a quantidade em ml");return}addRecord("water",{amountMl:amount},$("#waterDate").value,$("#waterTime").value);toast("Água registrada");closeModal();render();return}
 if(a==="save-food"){addRecord("meal",{meal:$("#foodMeal").value,amount:$("#foodAmount").value,note:$("#foodNote").value.trim()},$("#foodDate").value,$("#foodTime").value);toast("Alimentação registrada");closeModal();render();return}
 if(a==="save-sleep"){addRecord("sleep",{startTime:$("#sleepStart").value,endTime:$("#sleepEnd").value,quality:$("#sleepQuality").value.trim()},$("#sleepDate").value,$("#sleepEnd").value||now());toast("Sono registrado");closeModal();render();return}
 if(a==="save-state"){
   const parts=[];if(PICKS.fala!=null)parts.push(`fala: ${SCALE.fala[PICKS.fala]}`);if(PICKS.agitacao!=null)parts.push(`agitação: ${SCALE.agitacao[PICKS.agitacao]}`);if(PICKS.orientacao!=null)parts.push(`orientação: ${SCALE.orientacao[PICKS.orientacao]}`);
   if(!parts.length&&!PICKS.moods.length&&!$("#stateNote").value.trim()){toast("Registre ao menos uma observação");return}
   addRecord("state",{fala:PICKS.fala,agitacao:PICKS.agitacao,orientacao:PICKS.orientacao,mood:[...PICKS.moods],summary:parts.join(" · ")||PICKS.moods.join(", "),note:$("#stateNote").value.trim()},$("#stateDate").value,$("#stateTime").value);toast("Estado registrado");closeModal();render();return
 }
 if(a==="save-symptom"){if(!PICKS.symptom){toast("Selecione um sintoma");return}addRecord("symptom",{symptom:PICKS.symptom,note:$("#symNote").value.trim()},$("#symDate").value,$("#symTime").value);toast("Sintoma registrado");closeModal();render();return}
 if(a==="save-activity"){const v=$("#actName").value.trim();if(!v){toast("Informe a atividade");return}addRecord("activity",{activity:v,duration:$("#actDuration").value},$("#actDate").value,$("#actTime").value);toast("Atividade registrada");closeModal();render();return}
 if(a==="save-evac"){addRecord("evacuation",{kind:$("#evKind").value,note:$("#evNote").value.trim()},$("#evDate").value,$("#evTime").value);toast("Evacuação registrada");closeModal();render();return}
 if(a==="save-urine"){addRecord("urine",{color:$("#urColor").value,note:$("#urNote").value.trim()},$("#urDate").value,$("#urTime").value);toast("Urina registrada");closeModal();render();return}
 if(a==="save-note"){const v=$("#noteText").value.trim();if(!v){toast("Escreva a observação");return}addRecord("note",{text:v},$("#noteDate").value,$("#noteTime").value);toast("Observação registrada");closeModal();render();return}
 if(a==="save-med-config"){
   const name=$("#newMedName").value.trim(),dose=$("#newMedDose").value.trim(),times=$("#newMedTimes").value.split(",").map(x=>x.trim()).filter(Boolean);
   if(!name||!times.length){toast("Informe nome e ao menos um horário");return}S.medications.push({id:uid(),name,dose,times});save();toast("Medicação adicionada à rotina");renderSheet();renderHeader();return
 }
 if(a==="delete-med"){S.medications=S.medications.filter(m=>m.id!==el.dataset.id);save();toast("Medicação removida da rotina");renderSheet();return}
 if(a==="delete-record"){if(confirm("Excluir este registro histórico?")){const eraJornada=el.closest(".sheet")?.querySelector(".sheet-title")?.textContent==="Família";removeRecord(el.dataset.id);toast("Registro excluído");if(eraJornada){familyModal();renderHeader()}else{render()}}return}
 if(a==="prev-day"){DATE=addDay(DATE,-1);render();return}
 if(a==="estado-prev-dia"){ESTADO_DIA=addDay(ESTADO_DIA,-1);render();return}
 if(a==="estado-next-dia"){if(ESTADO_DIA<today())ESTADO_DIA=addDay(ESTADO_DIA,1);render();return}
 if(a==="next-day"){DATE=addDay(DATE,1);render();return}
 if(a==="report-days"){REPORT_DAYS=+el.dataset.days;render();return}
 if(a==="copy-report"){const t=$("#report");t.select();navigator.clipboard?.writeText(t.value).then(()=>toast("Resumo copiado")).catch(()=>{document.execCommand("copy");toast("Resumo copiado")});return}
 if(a==="download-report"){const b=new Blob([$("#report").value],{type:"text/plain"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=`nexo-resumo-${DATE}.txt`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1200);return}
 if(a==="print"){window.print();return}
 if(a==="add-caregiver"){const n=prompt("Nome do cuidador:")?.trim();if(n&&!S.caregivers.includes(n)){S.caregivers.push(n);save();familyModal()}return}
 if(a==="save-caregiver-shift"){
   const caregiver=$("#shiftCaregiver")?.value.trim(),date=$("#shiftDate")?.value,start=$("#shiftStart")?.value,end=$("#shiftEnd")?.value,note=$("#shiftNote")?.value.trim();
   if(!caregiver||!date||!start||!end){toast("Informe cuidador, data, início e fim");return}
   addRecord("caregiver_shift",{caregiverName:caregiver,startTime:start,endTime:end,note},date,start);
   toast("Jornada do cuidador registrada");
   familyModal();renderHeader();return
 }
 if(a==="export"){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=`nexo-temporal-${today()}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1200);return}
 if(a==="import"){$("#importFile").click();return}
});
document.addEventListener("input",e=>{
 const el=e.target;
 if(el.id==="authName"){authDraft.name=el.value;return}
 if(el.id==="authEmail"){authDraft.email=el.value;return}
 if(!el.dataset.root)return;
 const p=el.dataset.root.split(".");let x=S;for(let i=0;i<p.length-1;i++){x[p[i]]=x[p[i]]||{};x=x[p[i]]}x[p[p.length-1]]=el.value;save();renderHeader()
});
function mergeIncoming(remote){
 if(!remote||typeof remote!=="object")return[];
 remote={...base(),...remote};
 S.caregivers=Array.from(new Set([...(S.caregivers||[]),...(remote.caregivers||[])]));
 if(!S.patient&&remote.patient)S.patient=remote.patient;
 S.contacts=S.contacts||{};
 Object.keys(remote.contacts||{}).forEach(k=>{if(!S.contacts[k]&&remote.contacts[k])S.contacts[k]=remote.contacts[k]});
 S.plan=S.plan||{};
 Object.keys(remote.plan||{}).forEach(k=>{if(!S.plan[k]&&remote.plan[k])S.plan[k]=remote.plan[k]});
 const medIds=new Set(S.medications.map(m=>m.id));
 (remote.medications||[]).forEach(m=>{if(!medIds.has(m.id))S.medications.push(m)});
 const recIds=new Set(S.records.map(r=>r.id));
 const novos=[];
 (remote.records||[]).forEach(r=>{if(r.id&&!recIds.has(r.id)){S.records.push(r);novos.push(r)}});
 return novos;
}

   (Console Firebase → ⚙ Configurações do projeto → seus apps → Config)
   Isso NÃO é segredo: a segurança vem das Regras do banco, não daqui.

const FIREBASE_CONFIG={
 apiKey:"AIzaSyCSxBntRai08obSyldrFDnDGYWUUbGhGMI",
 authDomain:"nexus-27fab.firebaseapp.com",
 databaseURL:"https://nexus-27fab-default-rtdb.firebaseio.com",
 projectId:"nexus-27fab"
};
const FAMILY_PATH="familia";
function firebaseConfigurado(){return FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey.indexOf("SUBSTITUA")===-1}

/* =======================================================================
   AUTENTICAÇÃO — cada pessoa com login próprio, todos na mesma família
   ======================================================================= */
let fbApp=null,fbAuth=null,fbDb=null,authUser=null,dbConectado=false;
let authMode="login",authBusy=false;

function iniciarFirebase(){
 if(!firebaseConfigurado()){renderAuthGate();return}
 fbApp=firebase.initializeApp(FIREBASE_CONFIG);
 fbAuth=firebase.auth();
 fbDb=firebase.database();
 fbDb.ref(".info/connected").on("value",snap=>{
  dbConectado=snap.val()===true;
  if(authUser){renderHeader();if(document.querySelector(".sheet-title")?.textContent==="Família")familyModal()}
 });
 fbAuth.onAuthStateChanged(user=>{
  authUser=user;
  if(user){
   S.activeCaregiver=user.displayName||user.email||S.activeCaregiver;
   save();
   entrarNoApp();
   ligarEscutaEmTempoReal();
  }else{
   sairDoApp();
  }
 })
}
function entrarNoApp(){
 $("#authGate").innerHTML="";
 $("#app").style.display="";
 $("#bottomNav").style.display="";
 $("#fabBtn").style.display="";
 render()
}
function sairDoApp(){
 $("#app").style.display="none";
 $("#bottomNav").style.display="none";
 $("#fabBtn").style.display="none";
 closeModal();
 renderAuthGate()
}
function ligarEscutaEmTempoReal(){
 fbDb.ref(FAMILY_PATH).on("value",snap=>{
  const remoto=snap.val();
  if(!remoto)return; // banco vazio ainda — nada pra puxar
  const novos=mergeIncoming(remoto);
  if(novos.length){
   localStorage.setItem(KEY,JSON.stringify(S));
   notifyNewRecords(novos);
   render()
  }
 },err=>console.warn("escuta em tempo real:",err))
}
function pushToCloud(){
 if(!fbDb||!authUser)return;
 fbDb.ref(FAMILY_PATH).once("value").then(snap=>{
  mergeIncoming(snap.val());
  return fbDb.ref(FAMILY_PATH).set(S)
 }).catch(err=>console.warn("push:",err))
}
let pushTimer=null;
function scheduleSync(){if(!authUser)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushToCloud,900)}

const AUTH_ERROS={
 "auth/invalid-email":"E-mail inválido.",
 "auth/user-not-found":"Não existe conta com esse e-mail.",
 "auth/wrong-password":"Senha incorreta.",
 "auth/invalid-credential":"E-mail ou senha incorretos.",
 "auth/email-already-in-use":"Já existe uma conta com esse e-mail — tente entrar em vez de criar.",
 "auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.",
 "auth/too-many-requests":"Muitas tentativas. Espere um pouco e tente de novo."
};

 if(!firebaseConfigurado()){
  $("#authGate").innerHTML=`<div class="auth-gate"><div class="auth-box">
   <h1>Configuração pendente</h1>
   <p class="sub">Antes de usar, alguém da família precisa criar o banco gratuito no Firebase.</p>
   <div class="auth-setup">
    <p><b>1.</b> Entre em <b>console.firebase.google.com</b>, crie um projeto (pode recusar o Analytics).</p>
    <p><b>2.</b> Em <b>Build → Authentication</b>, ative o método <b>E-mail/senha</b>.</p>
    <p><b>3.</b> Em <b>Build → Realtime Database</b>, crie o banco (modo bloqueado) e cole nas Regras:</p>
    <pre>{
  "rules": {
    "${FAMILY_PATH}": {
      ".read": "auth != null",
      ".write": "auth != null"
    }
  }
}</pre>
    <p><b>4.</b> Em <b>⚙ Configurações do projeto → seus apps → Config</b>, copie os 4 valores e cole nas primeiras linhas do arquivo, dentro de <code>FIREBASE_CONFIG</code>.</p>
    <p><b>5.</b> Hospede este arquivo (ex.: GitHub Pages) para virar um link de verdade, ou apenas reabra-o após editar.</p>
   </div>
  </div></div>`;
  return
 }
 $("#authGate").innerHTML=`<div class="auth-gate"><div class="auth-box" id="authBox"></div></div>`;
 renderAuthBox()
}
let authDraft={name:"",email:""};
function renderAuthBox(){
 const box=$("#authBox");if(!box)return;
 authMode="login";
 box.innerHTML=`
  <h1>Nexo</h1>
  <p class="sub">Diário de cuidado da família</p>
  <div id="authErr"></div>
  <div class="field"><label>E-mail</label><input id="authEmail" type="email" autocomplete="email" value="${esc(authDraft.email)}"></div>
  <div class="field"><label>Senha</label><input id="authPass" type="password" autocomplete="current-password"></div>
  <button class="primary" data-a="auth-submit" ${authBusy?"disabled":""}>${authBusy?"Aguarde…":"Entrar"}</button>
  <button class="auth-forgot" data-a="auth-forgot">Esqueci minha senha</button>
 `
}
function authErro(msg){$("#authErr").innerHTML=msg?`<div class="auth-err">${esc(msg)}</div>`:""}
function submeterAuth(){
 const email=$("#authEmail").value.trim(),pass=$("#authPass").value;
 if(!email||!pass){authErro("Preencha e-mail e senha.");return}
 authBusy=true;renderAuthBox();authErro("");
 fbAuth.signInWithEmailAndPassword(email,pass)
  .catch(err=>{authBusy=false;renderAuthBox();authErro(AUTH_ERROS[err.code]||err.message)})
}
function esqueciSenha(){
 const email=$("#authEmail").value.trim();
 if(!email){authErro("Digite seu e-mail acima primeiro.");return}
 fbAuth.sendPasswordResetEmail(email)
  .then(()=>{authErro("");toast("Enviamos um link de redefinição para "+email)})
  .catch(err=>authErro(AUTH_ERROS[err.code]||err.message))
}
function sair(){if(confirm("Sair da sua conta neste aparelho?"))fbAuth.signOut()}

/* NOTIFICAÇÕES */
function notifyEnabled(){try{return localStorage.getItem("nexo.notify")==="1"}catch(e){return false}}
function setNotifyEnabled(v){try{localStorage.setItem("nexo.notify",v?"1":"0")}catch(e){}}
function requestNotify(){
 if(!("Notification"in window)){toast("Este navegador não aceita notificações");return}
 Notification.requestPermission().then(p=>{
  if(p==="granted"){setNotifyEnabled(true);toast("Avisos ativados neste aparelho")}
  else{setNotifyEnabled(false);toast("Permissão não concedida")}
  if(document.querySelector(".sheet-title")?.textContent==="Família")familyModal()
 })
}
function notifyNewRecords(novos){
 if(!novos||!novos.length)return;
 const deOutros=novos.filter(r=>r.caregiver&&r.caregiver!==S.activeCaregiver);
 if(!deOutros.length)return;
 if(notifyEnabled()&&"Notification"in window&&Notification.permission==="granted"){
  deOutros.forEach(r=>{const f=fmtRec(r);try{new Notification("Nexo · "+r.caregiver,{body:f.title+(f.sub?" — "+f.sub:""),tag:r.id})}catch(e){}})
 }
 if(deOutros.length===1){const f=fmtRec(deOutros[0]);toast(`${deOutros[0].caregiver} registrou: ${f.title}`)}
 else toast(`${deOutros.length} novos registros da família`)
}
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.root){const p=el.dataset.root.split(".");let x=S;for(let i=0;i<p.length-1;i++){x[p[i]]=x[p[i]]||{};x=x[p[i]]}x[p[p.length-1]]=el.value;save();renderHeader();return}
 if(el.id==="importFile"){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{mergeIncoming(JSON.parse(r.result));save();toast("Registros combinados — nada foi apagado");closeModal();render()}catch(err){toast("Arquivo inválido")}};r.readAsText(f)}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&document.getElementById("authBox")?.contains(e.target)){submeterAuth()}
});
function applyTheme(){const sys=matchMedia?.("(prefers-color-scheme:dark)").matches,d=THEME==="dark"||(THEME==="auto"&&sys);document.documentElement.dataset.theme=d?"dark":"light"}
applyTheme();
iniciarFirebase();
